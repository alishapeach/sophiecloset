# The publish directory must NOT contain the functions directory, or Netlify
# treats the setup as misconfigured. Site files live in public/, functions sit
# outside it.
[build]
  publish = "public"
  functions = "netlify/functions"
  # Explicit, so the dependency is installed even though there is nothing to build.
  command = "npm install"

# The closet's API. The function also answers on its own default address at
# /.netlify/functions/closet; this just gives it a tidier one.
[[redirects]]
  from = "/api/closet"
  to = "/.netlify/functions/closet"
  status = 200
  force = true

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, noimageindex"
    Referrer-Policy = "no-referrer"
